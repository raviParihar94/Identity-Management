spring:
  application:
    name: iam-security-system

  datasource:
    url: jdbc:mysql://localhost:3306/ima_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: user:email,read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - user:email
              - read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ===================== JWT CONFIGURATION =====================
jwt:
  secret: "IkBI4Gv+apKNCHojkUwAK9ktiUej5L/SD2H3l5fQskd/knPmDlta6lgMI3NBGdB1z7LuuKXAx7pXKyejsH2o1g=="
  expiration: 86400000           # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# ===================== MFA CONFIGURATION =====================
mfa:
  issuer: IAM-Security-System

# ===================== CORS CONFIGURATION =====================
cors:
  allowed-origins: "http://localhost:3000"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

# ===================== LOGGING =====================
logging:
  level:
    root: INFO
    com.ima: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
